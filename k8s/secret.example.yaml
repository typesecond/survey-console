apiVersion: v1
kind: Secret
metadata:
  name: app-config
type: Opaque
stringData:
  production.yaml: |
    auth:
      access_token_secret: REPLACE_WITH_A_RANDOM_ACCESS_SECRET_AT_LEAST_32_CHARACTERS
      access_token_expiration: 120
      refresh_token_secret: REPLACE_WITH_A_RANDOM_REFRESH_SECRET_AT_LEAST_32_CHARACTERS
      refresh_token_expiration: 14400
      refresh_cookie_name: refresh_token
      bcrypt_salt_rounds: 10
    routes:
      api_prefix: /api
      user_prefix: /user
    db:
      host: postgres
      port: 5432
      user: appuser
      password: appsecret
      dbname: appdb
    redis:
      host: redis
      port: 6379
      db: 0
      cache_ttl_seconds: 60
    debug:
      problem_details: false
